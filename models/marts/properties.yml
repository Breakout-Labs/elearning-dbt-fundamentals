models:
  - name: customers
    description: Each record represents a customer.
    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
      - name: first_name
        description: A customer's first name.
      - name: last_name
        description: A customer's last name.
      - name: count_orders
        description: The number of orders a customer has had all-time.
      - name: first_order_at
        description: The timestamp of a customer's first order.
      - name: most_recent_order_at
        description: The timestamp of a customer's most recent order.
  - name: orders
    description: This model combines order and delivery data to analyze delivery times and order processing efficiency.
    columns:
    - name: order_id
      description: A unique identifier for each order.
    - name: customer_id
      description: '{{ doc("customer_id") }}'
    - name: ordered_at
      description: The timestamp when the order was placed.
    - name: order_status
      description: The current status of the order.
    - name: total_amount
      description: The total monetary value of the order.
    - name: delivery_time_from_order
      description: The time in hours from when the order was placed to when it was delivered.
    - name: delivery_time_from_collection
      description: The time in hours from when the order was picked up to when it was
        delivered.