version: 2

models:
  - name: orders
    columns:
      - name: order_id
        data_tests:
          - unique:
              config:
                store_failures: true
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                field: customer_id
                to: ref('customers')
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - USD